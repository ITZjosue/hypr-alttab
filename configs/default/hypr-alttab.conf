[General]
# Switcher size, as a percentage of the screen (1-100). It is always centered.
WidthPercent =  100
HeightPercent = 60

# Font Size in pixels
FontSize = 20

# Max preview card width in pixels (cards shrink automatically to fit the switcher)
PreviewWidth = 400

# Space between the switcher edge and the cards, in pixels
Padding = 40

# Gap between cards (horizontal and vertical), in pixels
Spacing = 30

# Multi-monitor behavior
# false = Show only workspaces on the currently active monitor
ShowAllMonitors = false

# Icon Size for the overlay badge (0 = Auto, >0 = Fixed size in pixels)
IconSize = 0
# Tab behaviour
# true  = cycle between workspaces (each card is a whole workspace)
# false = cycle between the windows on the current workspace (one card per window)
CycleWorkspaces = true

# Allow the mouse to select/confirm entries in the switcher
# false = keyboard only; a cursor resting over a card cannot hijack the selection
MouseSelection = false
